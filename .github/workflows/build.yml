name: Build and Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install
        continue-on-error: true

      - name: Validate vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('✓ vercel.json valid')"

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('✓ package.json valid')"

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check helper-bot.js
          node --check image-loader.js
          node --check item-detail.js
          echo "✓ All JavaScript files are valid"

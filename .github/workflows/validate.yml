name: File Structure Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Validate configuration files
        run: |
          echo "Validating configuration files..."
          node -e "const fs = require('fs'); try { JSON.parse(fs.readFileSync('package.json', 'utf8')); console.log('✓ package.json'); } catch (e) { console.error('✗ package.json'); process.exit(1); }"

      - name: Check project structure
        run: |
          echo "Checking project structure..."
          for f in index.html gallery.html shop.html item-detail.html contact.html features.html canvas.html pattern.html script.js helper-bot.js image-loader.js item-detail.js gallery-data.js styles.css; do
            [ -f "$f" ] && echo "✓ $f" || (echo "✗ Missing $f"; exit 1)
          done

      - name: Check optional directories
        run: |
          echo "Checking optional directories..."
          [ -d "api" ] && echo "✓ api directory" || echo "ℹ api directory not found"
          [ -d ".github/workflows" ] && echo "✓ .github/workflows" || echo "ℹ workflows not found"
          [ -f "package-lock.json" ] && echo "✓ package-lock.json" || echo "ℹ package-lock.json not found"
          exit 0

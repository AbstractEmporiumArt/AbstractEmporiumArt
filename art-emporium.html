<script>
// Shared cart across all 3 shops
(function() {
  if (!window.aeCart) window.aeCart = { items: [] };
  function save() { localStorage.setItem('ae_cart', JSON.stringify(window.aeCart.items)); }
  function load() {
    try { var s = localStorage.getItem('ae_cart'); if (s) window.aeCart.items = JSON.parse(s); } catch(e){}
  }
  load();
  window.aeAddToCart = function(id, name, price, qty) {
    qty = qty || 1; var existing = window.aeCart.items.find(i => i.id === id);
    if (existing) existing.qty += qty; else window.aeCart.items.push({id:id, name:name, price:parseFloat(price)||0, qty:qty});
    save(); alert('Added: ' + name + ' (x' + qty + ')');
  };
  window.aeRemoveFromCart = function(id) {
    window.aeCart.items = window.aeCart.items.filter(i => i.id !== id); save();
  };
  window.aeGetCart = function() { return window.aeCart.items; };
})();
</script>

<script>
// FALLBACK: directly apply display styles to slides (bypasses CSS dependency)
document.addEventListener('DOMContentLoaded', function() {
  // For each gallery, hide all .slide except first
  ['gallery-cd','gallery-origin','gallery-wood','gallery-draw','gallery-sold'].forEach(function(id) {
    var box = document.getElementById(id);
    if (!box) return;
    var slides = box.querySelectorAll('img');
    slides.forEach(function(s, i) {
      if (i === 0) { s.style.display = 'block'; s.classList.add('active'); }
      else { s.style.display = 'none'; s.classList.remove('active'); }
    });
  });
  // Ensure navSlide updates display
  window.navSlide = function(id, delta) {
    var box = document.getElementById(id);
    if (!box) return;
    var slides = Array.from(box.querySelectorAll('img'));
    var idx = slides.findIndex(function(s) { return s.style.display !== 'none'; });
    if (idx < 0) idx = 0;
    idx = (idx + delta + slides.length) % slides.length;
    slides.forEach(function(s, i) { s.style.display = (i === idx) ? 'block' : 'none'; });
    var ctr = document.getElementById('count-' + id.replace('gallery-','')) || document.getElementById('count-cd');
    if (ctr) ctr.textContent = (idx + 1) + ' / ' + slides.length;
  };
});
</script>

name: File Structure Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping install"
          fi

      - name: Validate configuration files
        run: |
          echo "Validating configuration files..."
          node -e "const fs = require('fs'); try { JSON.parse(fs.readFileSync('package.json', 'utf8')); console.log('✓ package.json'); } catch (e) { console.error('✗ package.json'); process.exit(1); }"

      - name: Check project structure
        run: |
          echo "Checking project structure..."
          for f in index.html gallery.html shop.html item-detail.html contact.html features.html pattern.html script.js helper-bot.js image-loader.js item-detail.js gallery-data.js styles.css; do
            [ -f "$f" ] && echo "✓ $f" || (echo "✗ Missing $f"; exit 1)
          done

      - name: Check optional directories
        run: |
          echo "Checking optional directories..."
          [ -d "api" ] && echo "✓ api directory" || echo "ℹ api directory not found"
          [ -d ".github/workflows" ] && echo "✓ .github/workflows" || echo "ℹ workflows not found"
          [ -f "package-lock.json" ] && echo "✓ package-lock.json" || echo "ℹ package-lock.json not found"
          exit 0

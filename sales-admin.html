<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_VERIFICATION_TOKEN">
    <meta name="msvalidate.01" content="REPLACE_WITH_BING_VERIFICATION_TOKEN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management - Abstract Emporium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff4444;
        }

        .btn-danger:hover {
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.4);
        }

        .sale-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .sale-item h3 {
            color: #333;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sale-item p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .sale-item .meta {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-artpal { background: #FF6B6B; color: white; }
        .badge-fineartamerica { background: #4ECDC4; color: white; }
        .badge-thehug { background: #95E1D3; color: white; }
        .badge-active { background: #4CAF50; color: white; }
        .badge-upcoming { background: #FFC107; color: white; }
        .badge-expired { background: #999; color: white; }

        .sale-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .sale-actions button {
            padding: 6px 15px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .preview-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .preview-box h3 {
            color: #333;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .sale-item .meta {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Sales & Promotions Manager</h1>
            <p>Manage real-time announcements for ArtPal, Fine Art America, and The HUG</p>
        </div>

        <div class="grid">
            <!-- Add New Sale Form -->
            <div class="card">
                <h2>➕ Add New Sale</h2>
                <form id="add-sale-form">
                    <div class="form-group">
                        <label for="platform">Platform</label>
                        <select id="platform" required>
                            <option value="">Select Platform</option>
                            <option value="artpal">🎨 ArtPal</option>
                            <option value="fineartamerica">🖼️ Fine Art America</option>
                            <option value="thehug">💎 The HUG</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="title">Sale Title</label>
                        <input type="text" id="title" placeholder="e.g., Black Friday Sale - 30% Off" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="2" placeholder="e.g., Save big on all prints and merchandise!"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="discount">Discount Amount</label>
                        <input type="text" id="discount" placeholder="e.g., 30% or Free Shipping" required>
                    </div>

                    <div class="form-group">
                        <label for="code">Promo Code (optional)</label>
                        <input type="text" id="code" placeholder="e.g., SAVE30">
                    </div>

                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="datetime-local" id="startDate" required>
                    </div>

                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="datetime-local" id="endDate" required>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority (1 = highest)</label>
                        <input type="number" id="priority" value="2" min="1" max="10">
                    </div>

                    <button type="submit" class="btn">Add Sale</button>
                </form>
            </div>

            <!-- Active Sales List -->
            <div class="card">
                <h2>📢 Active & Upcoming Sales</h2>
                <div id="sales-list"></div>
            </div>
        </div>

        <!-- Preview Section -->
        <div class="card">
            <h2>👁️ Live Preview</h2>
            <p style="color: #666; margin-bottom: 15px;">This is how the announcement will appear on your website:</p>
            <div id="preview-container"></div>
        </div>
    </div>

    <script src="sales-announcements.js"></script>
    <script>
        let salesSystem;

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize sales system
            salesSystem = new SalesAnnouncementSystem();
            
            // Set default dates
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
            const nextWeek = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            document.getElementById('startDate').value = formatDateTimeLocal(now);
            document.getElementById('endDate').value = formatDateTimeLocal(nextWeek);

            // Load sales list
            loadSalesList();

            // Form submission
            document.getElementById('add-sale-form').addEventListener('submit', (e) => {
                e.preventDefault();
                addNewSale();
            });

            // Update preview
            updatePreview();
        });

        function formatDateTimeLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function addNewSale() {
            const saleData = {
                platform: document.getElementById('platform').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                discount: document.getElementById('discount').value,
                code: document.getElementById('code').value,
                startDate: new Date(document.getElementById('startDate').value).toISOString(),
                endDate: new Date(document.getElementById('endDate').value).toISOString(),
                priority: parseInt(document.getElementById('priority').value)
            };

            salesSystem.addSale(saleData);
            
            // Reset form
            document.getElementById('add-sale-form').reset();
            const now = new Date();
            const nextWeek = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            document.getElementById('startDate').value = formatDateTimeLocal(now);
            document.getElementById('endDate').value = formatDateTimeLocal(nextWeek);
            
            // Reload list and preview
            loadSalesList();
            updatePreview();
            
            alert('✅ Sale added successfully!');
        }

        function loadSalesList() {
            const container = document.getElementById('sales-list');
            const sales = salesSystem.activeSales;

            if (sales.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2"/>
                        </svg>
                        <p>No active sales. Add one above!</p>
                    </div>
                `;
                return;
            }

            const now = new Date();
            const html = sales.map(sale => {
                const start = new Date(sale.startDate);
                const end = new Date(sale.endDate);
                const isActive = now >= start && now <= end;
                const isUpcoming = now < start;
                const isExpired = now > end;
                
                const platform = salesSystem.platforms[sale.platform];
                
                return `
                    <div class="sale-item">
                        <h3>
                            ${platform.icon} ${sale.title}
                        </h3>
                        <p>${sale.description || ''}</p>
                        <div class="meta">
                            <span class="badge badge-${sale.platform}">${platform.name}</span>
                            <span class="badge ${isActive ? 'badge-active' : isUpcoming ? 'badge-upcoming' : 'badge-expired'}">
                                ${isActive ? 'Active' : isUpcoming ? 'Upcoming' : 'Expired'}
                            </span>
                            <span>${sale.discount}</span>
                            ${sale.code ? `<span>Code: <strong>${sale.code}</strong></span>` : ''}
                        </div>
                        <div class="meta">
                            <small>Starts: ${start.toLocaleString()}</small>
                            <small>Ends: ${end.toLocaleString()}</small>
                        </div>
                        <div class="sale-actions">
                            <button class="btn btn-danger" onclick="deleteSale(${sale.id || sales.indexOf(sale)})">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function deleteSale(index) {
            if (!confirm('Are you sure you want to delete this sale?')) return;
            
            salesSystem.activeSales.splice(index, 1);
            salesSystem.saveSales();
            loadSalesList();
            updatePreview();
            salesSystem.render();
            
            alert('Sale deleted successfully!');
        }

        function updatePreview() {
            const container = document.getElementById('preview-container');
            const bar = document.getElementById('sales-announcement-bar');
            
            if (bar) {
                container.innerHTML = bar.outerHTML;
            } else {
                container.innerHTML = '<p style="color: #999;">No active announcements to preview.</p>';
            }
        }

        // Update preview every 5 seconds
        setInterval(updatePreview, 5000);
    </script>
</body>
</html>

name: Social Media Auto-Poster

on:
  # Run three times daily: 8am, 2pm, 9pm UTC (spread across day and evening)
  schedule:
    - cron: '0 8,14,21 * * *'  # 8:00 AM, 2:00 PM, 9:00 PM UTC daily
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to post to'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mastodon
          - bluesky

permissions:
  contents: write  # Needed to update content-queue.json and content-history.json
  models: read     # Needed for GitHub Models API (AI content generation)

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Check queue depth and generate content if low
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📊 Checking unposted queue depth..."
          UNPOSTED=$(node -e "
            const q = JSON.parse(require('fs').readFileSync('content-queue.json','utf8'));
            const count = q.posts.filter(p => !p.posted && !p.postedAt).length;
            process.stdout.write(String(count));
          ")
          echo "Unposted posts: $UNPOSTED"
          echo "UNPOSTED_COUNT=$UNPOSTED" >> $GITHUB_ENV

          if [ "$UNPOSTED" -lt "4" ]; then
            echo "🤖 Queue is low ($UNPOSTED unposted). Generating new content..."
            GENERATE_COUNT=3 node scripts/generate-content.js
            echo "CONTENT_GENERATED=true" >> $GITHUB_ENV
          else
            echo "✅ Queue has $UNPOSTED posts — no generation needed."
            echo "CONTENT_GENERATED=false" >> $GITHUB_ENV
          fi
        continue-on-error: false

      - name: Select synced post target
        run: |
          echo "🎯 Selecting next shared post target for both platforms..."
          TARGET_POST_ID=$(node -e "
            const q = JSON.parse(require('fs').readFileSync('content-queue.json','utf8'));
            const now = new Date();
            const due = q.posts.filter(p => new Date(p.schedule) <= now);
            const synced = due.find(p => {
              const posted = p.postedPlatforms || [];
              const wantsBoth = (p.platforms || []).includes('mastodon') && (p.platforms || []).includes('bluesky');
              const mastodonDone = posted.includes('mastodon');
              const blueskyDone = posted.includes('bluesky');
              return wantsBoth && !(mastodonDone && blueskyDone);
            });
            process.stdout.write(synced ? synced.id : '');
          ")

          if [ -z "$TARGET_POST_ID" ]; then
            echo "ℹ️ No synced due post found right now."
          else
            echo "✅ Synced target selected: $TARGET_POST_ID"
          fi

          echo "TARGET_POST_ID=$TARGET_POST_ID" >> $GITHUB_ENV

      - name: Post to Mastodon
        if: ${{ github.event.inputs.platform == 'mastodon' || github.event.inputs.platform == 'all' || github.event_name == 'schedule' }}
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MastodonAccessToken }}
          MASTODON_INSTANCE_URL: ${{ secrets.MastodonInstanceUrl }}
          TARGET_POST_ID: ${{ env.TARGET_POST_ID }}
        run: |
          if [ ! -z "$MASTODON_ACCESS_TOKEN" ]; then
            echo "🦣 Posting to Mastodon..."
            node scripts/post-to-mastodon.js || echo "⚠️ No posts ready for Mastodon"
          else
            echo "⚠️ Mastodon secrets not configured, skipping..."
          fi
        continue-on-error: true
      
      - name: Post to Bluesky
        if: ${{ github.event.inputs.platform == 'bluesky' || github.event.inputs.platform == 'all' || github.event_name == 'schedule' }}
        env:
          BLUESKY_HANDLE: ${{ secrets.BlueskyHandle }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BlueskyAppPassword }}
          TARGET_POST_ID: ${{ env.TARGET_POST_ID }}
        run: |
          if [ ! -z "$BLUESKY_HANDLE" ]; then
            echo "🦋 Posting to Bluesky..."
            node scripts/post-to-bluesky.js || echo "⚠️ No posts ready for Bluesky"
          else
            echo "⚠️ Bluesky secrets not configured, skipping..."
          fi
        continue-on-error: true
      
      - name: Commit updated queue
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet content-queue.json data/content-history.json; then
            echo "ℹ️ No changes to commit"
          else
            git add content-queue.json data/content-history.json
            git commit -m "🤖 Update content queue after posting [skip ci]"
            git push
            echo "✅ Pushed updated content queue"
          fi

name: Scheduled Maintenance

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Check for dependency updates
        run: npm outdated || true

      - name: Run npm audit fix (dry-run)
        run: npm audit --audit-level=moderate || true

      - name: Validate package.json
        run: node -e "require('fs').existsSync('package.json') && JSON.parse(require('fs').readFileSync('package.json')); console.log('package.json is valid')"

      - name: Check Node version compatibility
        run: |
          echo "Node version requirements:"
          node -e "const pkg = require('./package.json'); console.log('Requires Node:', pkg.engines?.node || 'Not specified')"

      - name: Create issue if updates needed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Scheduled maintenance: Dependencies need updates',
              body: 'Automated check detected that dependencies may need updating. Please review with `npm outdated` and update as needed.',
              labels: ['maintenance', 'dependencies']
            })
